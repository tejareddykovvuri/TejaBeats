<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
		<meta name="theme-color" content="#0A0A0F" />
		<meta name="description" content="TejaBeats — Your Music. Your Beats. Stream high-quality music directly in your browser." />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

		<!-- Google Fonts Fallbacks & Preconnect -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,600&display=swap" rel="stylesheet" />

		<!-- Preload Local TejaBeats Brand Fonts -->
		<link rel="preload" href="/fonts/Unageo-Bold.ttf" as="font" type="font/ttf" crossorigin />
		<link rel="preload" href="/fonts/Unageo-Semibold.ttf" as="font" type="font/ttf" crossorigin />
		<link rel="preload" href="/fonts/Gilroy-Bold.ttf" as="font" type="font/ttf" crossorigin />
		<link rel="preload" href="/fonts/Gilroy-Medium.ttf" as="font" type="font/ttf" crossorigin />
		<link rel="preload" href="/fonts/Gilroy-Regular.ttf" as="font" type="font/ttf" crossorigin />

		<link rel="manifest" href="/manifest.json" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="font-sans antialiased text-rendering-optimize">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
